<h4>Libros para leer</h4>
<p class="text-muted">Hay {{ libros.length }} libros en la lista.</p>

<ul class="list-group mb-3">
  <li class="list-group-item" *ngFor="let libro of libros">
    <strong>{{ libro.titulo }}</strong>
    <span class="text-muted"> - {{ libro.autor }}</span>
  </li>
</ul>

<form (submit)="agregar(titulo.value, autor.value); titulo.value=''; autor.value=''">
  <div class="row g-2">
    <div class="col-sm-5">
      <input #titulo type="text" class="form-control" placeholder="Titulo del libro">
    </div>
    <div class="col-sm-5">
      <input #autor type="text" class="form-control" placeholder="Autor">
    </div>
    <div class="col-sm-2">
      <button type="submit" class="btn btn-primary w-100">Agregar</button>
    </div>
  </div>
</form>
